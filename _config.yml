  lifestyle:
    nom: "Life-style"
    nom_en: "Lifestyle"
    sous_titre: "Mouvement, détente et self-care au quotidien"
    sous_titre_en: "Movement, relaxation and self-care, day to day"
    couleur: "#6D28D9"
    couleur_claire: "#EFE7FB"
    emoji: "🌙"
    statut: "À venir"
    statut_en: "Coming up"
    rubriques:
      mouvement:
        nom: "Mouvement"
        nom_en: "Movement"
        sous_rubriques: ["Yoga", "Sport"]
      detente:
        nom: "Détente"
        nom_en: "Relaxation"
        sous_rubriques: ["Méditation", "Rituels lecture/thé"]
      self-care:
        nom: "Self-care"
        nom_en: "Self-care"
        sous_rubriques: ["Soins capillaires", "Soins corporels"]

markdown: kramdown
permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"

exclude:
  - README.md
