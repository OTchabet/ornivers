title: Ornivers
description: "Le journal d'Ornella : études, art, pâtisserie et art de vivre, documentés au rythme réel d'une vraie progression."
author: Ornella
url: "https://otchabet.github.io"
baseurl: "/ornivers"

# Hiérarchie : parcours -> rubriques -> sous-rubriques
# Les champs *_en sont utilisés par le sélecteur de langue du site (interface bilingue,
# les articles eux-mêmes restent en français).
parcours:
  etudes:
    nom: "Études"
