      art-visuel:
        nom: "Art visuel"
        nom_en: "Visual art"
        sous_rubriques: ["Crayon", "Encre", "Aquarelle", "Acrylique"]
      art-textile:
        nom: "Art textile"
        nom_en: "Textile art"
        sous_rubriques: []
  patisserie:
    nom: "Pâtisserie"
    nom_en: "Pastry"
    sous_titre: "Des bases vers la maîtrise pâtissière"
    sous_titre_en: "From the basics to pastry mastery"
    couleur: "#E8956B"
    couleur_claire: "#FBE9DE"
    emoji: "🍰"
    statut: "À venir"
    statut_en: "Coming up"
