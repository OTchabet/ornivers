    sous_titre: "Vers la programmation, la cybersécurité, l'IA"
    sous_titre_en: "Towards programming, cybersecurity, AI"
    couleur: "#2B3A4A"
    couleur_claire: "#E9EDF1"
    emoji: "🪐"
    statut: "En cours"
    statut_en: "In progress"
    rubriques:
      remise-a-niveau:
        nom: "Remise à niveau"
        nom_en: "Catching up"
        sous_rubriques: ["Maths/logique", "Anglais", "Français"]
      programmation:
        nom: "Programmation"
        nom_en: "Programming"
        sous_rubriques: []
      cybersecurite:
        nom: "Cybersécurité"
        nom_en: "Cybersecurity"
        sous_rubriques: []
      ia:
        nom: "Intelligence artificielle"
        nom_en: "Artificial intelligence"
        sous_rubriques: []
  art:
    nom: "Art"
    nom_en: "Art"
    sous_titre: "Du traditionnel vers le numérique"
    sous_titre_en: "From traditional to digital"
    couleur: "#7A8B6F"
    couleur_claire: "#EBEEE8"
    emoji: "🎨"
    statut: "Bientôt"
